# Pile complete pour un deploiement Hostinger VPS (scenario A d'ARCHITECTURE.md #8).
# `docker compose up` doit suffire a froid : c'est le critere d'acceptation de la spec.
name: qrstudio

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    environment:
      # Epinglé ici et pas seulement dans l ENV de l image : `env_file` est plus fort que l ENV de
      # l image, et `.env` porte `config.settings.dev` pour le `runserver` local. Laisser filer, le VPS
      # tourne sur les reglages de dev : SQLite dans le conteneur, e-mails sur la console, ni HSTS ni
      # cookies `Secure` — et rien ne le dit, parce que ca fonctionne quand meme.
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://qrs:${POSTGRES_PASSWORD}@pgbouncer:6432/qrs
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Les migrations sont faites ici et nulle part ailleurs : `worker` et `beat` partagent le meme
      # point d'entree, et trois `migrate` en parallele sur un meme schema remontent des `DuplicateTable`
      # aleatoires au premier demarrage. `RUN_MIGRATIONS=0` chez eux, `service_healthy` en amont.
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      pgbouncer: {condition: service_started}
    volumes:
      - media:/app/media
    restart: unless-stopped
    command: >
      gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000 -w 4 --timeout 30 --keep-alive 75 --access-logfile -

  worker:
    build: {context: .., dockerfile: docker/Dockerfile}
    env_file: [../.env]
    environment:
      # Epinglé ici et pas seulement dans l ENV de l image : `env_file` est plus fort que l ENV de
      # l image, et `.env` porte `config.settings.dev` pour le `runserver` local. Laisser filer, le VPS
      # tourne sur les reglages de dev : SQLite dans le conteneur, e-mails sur la console, ni HSTS ni
      # cookies `Secure` — et rien ne le dit, parce que ca fonctionne quand meme.
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://qrs:${POSTGRES_PASSWORD}@pgbouncer:6432/qrs
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      RUN_MIGRATIONS: "0"
    command: celery -A config worker -Q default,ingest -l info --concurrency 4 --max-tasks-per-child 200
    depends_on: {app: {condition: service_healthy}}
    restart: unless-stopped

  beat:
    build: {context: .., dockerfile: docker/Dockerfile}
    env_file: [../.env]
    environment:
      # Epinglé ici et pas seulement dans l ENV de l image : `env_file` est plus fort que l ENV de
      # l image, et `.env` porte `config.settings.dev` pour le `runserver` local. Laisser filer, le VPS
      # tourne sur les reglages de dev : SQLite dans le conteneur, e-mails sur la console, ni HSTS ni
      # cookies `Secure` — et rien ne le dit, parce que ca fonctionne quand meme.
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://qrs:${POSTGRES_PASSWORD}@pgbouncer:6432/qrs
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      RUN_MIGRATIONS: "0"
    command: celery -A config beat -l info
    depends_on: {app: {condition: service_healthy}}
    restart: unless-stopped
    # Un seul beat : deux scheduleurs doubles each rebuild et done doublonner les compteurs.

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qrs
      POSTGRES_USER: qrs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
      - -c
      - wal_compression=on
      - -c
      - autovacuum_vacuum_scale_factor=0.05
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrs -d qrs"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      # Seulement ce dont l'image a besoin pour generer userlist.txt : le compte et le mot de passe.
      # Le reste (port, pools, mode) vit dans ./conf/pgbouncer.ini, montee en dur sous le nez de
      # l'image — voir le commentaire en tete de ce fichier pour pourquoi les variables ne suffisent pas.
      DB_USER: qrs
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./conf/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    # `auth_type = scram-sha-256` dans l'ini, mot de passe en clair dans userlist.txt (regenere a
    # chaque demarrage par l'image a partir de DB_PASSWORD): c'est la combinaison qui marche avec
    # Postgres 17, dont `password_encryption` vaut desormais scram. A confirmer au premier
    # `docker compose up` — ni Docker ni Postgres ne tournent dans ce bac a sable.
    ports: ["127.0.0.1:6432:6432"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    command: >
      valkey-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # allkeys-lru est delibere : une cle de cache perdue coute un select, une cle de compteur perdue
    # ne bloque personne. En revanche le stream de scans est en memoire => `consume_scans` doit tourner
    # souvent (voir beat) et la purge ne doit JAMAIS viser la base 0.

  # Non requis en scenario A : les logos restent cote navigateur (data URL) et `prod.py` ne declare
  # aucun backend S3. Le service est la pour le jour ou l'on stocke des fichiers, et ne demarre que si on
  # le demande : `docker compose --profile s3 up -d`.
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qrs
      # Style bloc, pas `environment: {a: b, c: ${X}}` : en YAML, une scalaire nue dans un flow mapping
      # ne peut pas porter d'accolade — le `}` de `${MINIO_SECRET}` fermait le flux et le fichier etait
      # invalide (`yaml.parser.ParserError` avant meme l'interpolation). Le service est sous profile, done
      # jamais demarre ici : l'erreur ne se voyait qu'au jour ou l'on active `--profile s3`.
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes: [miniodata:/data]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile:ro
      # Le build du studio (`cd ../qr-coding-react && npm ci && npm run build`). Caddy sert ces fichiers
      # pour tout ce qui n'est pas une route Django (voir @app dans le Caddyfile) : sans ce montage, la
      # racine du domaine repond un 404 du serveur de fichiers, pas une erreur de l'application.
      - ../qr-coding-react/dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: {app: {condition: service_started}}
    restart: unless-stopped

volumes:
  pgdata: {}
  media: {}
  miniodata: {}
  caddy_data: {}
  caddy_config: {}
