; Appendu a la configuration generee par l'image. Les valeurs de pool dimensionnent le nombre de
; connexions Reelles a Postgres : 3 conteneurs x 4 workers x (1 connection) = ~12 connexions utiles ;
; au-dela, Postgres consomme de la memoire pour rien (chaque backend ~10 Mo).
[pgbouncer]
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 40
min_pool_size = 4
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30
; PgBouncer en mode transaction casse les SET LOCAL / advisory locks : la migration est protegee
; par un verrou pose par `docker/entrypoint.sh` sur une connexion directe, pas via le pool.
ignore_startup_parameters = extra_float_digits,search_options
