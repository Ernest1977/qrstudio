<!doctype html><html lang="fr"><meta charset="utf-8">
<title>Confirmez votre adresse e-mail</title>
<body style="font:16px/1.5 system-ui,sans-serif;color:#171a26;background:#f6f7fb;margin:0;padding:24px">
  <div style="max-width:520px;margin:0 auto;background:#fff;border-radius:14px;padding:24px">
    <p>Bonjour,</p>
    <p>Confirmez votre adresse e-mail sur <strong>{{ brand }}</strong> avec le code :</p>
    <p style="font-size:28px;letter-spacing:.18em;font-weight:700;text-align:center;margin:18px 0">{{ code }}</p>
    <p style="color:#6b7280">Il expire dans {{ minutes }} minutes.</p>
    <p>Si vous n'avez rien demandé, ignorez ce message.</p>
    <p style="color:#6b7280;font-size:13px">— {{ brand }} · {{ support_email }}</p>
  </div>
</body></html>
