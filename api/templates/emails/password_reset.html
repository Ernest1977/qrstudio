<!doctype html><html lang="fr"><meta charset="utf-8"><title>Mot de passe oublié</title>
<body style="font:16px/1.5 system-ui,sans-serif;color:#171a26;background:#f6f7fb;margin:0;padding:24px">
<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:14px;padding:24px">
<p>Bonjour {{ user.email }},</p>
<p>Un nouveau mot de passe a été demandé pour votre compte <strong>{{ brand }}</strong>.</p>
<p style="margin:22px 0"><a href="{{ link }}" style="background:#e8c76a;color:#171a26;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600">Choisir un nouveau mot de passe</a></p>
<p style="color:#6b7280">Lien valable {{ hours }} heures. Si vous n'êtes pas à l'origine de la demande, ignorez ce message.</p>
</div></body></html>
