{% load csp %}
{% comment %}Style commun des pages /manage/. En ligne, volontairement : le back-office ne doit dependre d'aucun
   fichier statique servi par un CDN, ni d'un `collectstatic` qui aurait ete oublie au deploiement.{% endcomment %}
<style {% csp_nonce %}>
  .qrc-kpis { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; padding: 0; list-style: none; }
  .qrc-kpis > li { flex: 1 1 150px; margin: 0; padding: 10px 12px; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 10px; }
  .qrc-kpis b { display: block; font-size: 22px; line-height: 1.2; color: #0f172a; }
  .qrc-kpis span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; }
  .qrc-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin: 0 0 18px; }
  .qrc-card > h2 { margin: 0 0 8px; font-size: 15px; }
  .qrc-graph { display: block; max-width: 100%; height: auto; background: #fff; }
  .qrc-filtres { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 0 0 18px; }
  .qrc-filtres label { font-size: 12px; color: #334155; display: grid; gap: 4px; }
  .qrc-filtres select, .qrc-filtres input[type=text] { font-size: 13px; padding: 5px 7px; border: 1px solid #cbd5e1;
    border-radius: 6px; background: #fff; color: #0f172a; min-width: 130px; }
  .qrc-bouton { display: inline-block; font-size: 13px; padding: 7px 13px; border-radius: 7px; border: 1px solid #1d4ed8;
    background: #1d4ed8; color: #fff !important; cursor: pointer; text-decoration: none; }
  .qrc-bouton.secondaire { background: #fff; color: #1d4ed8 !important; border-color: #bfdbfe; }
  .qrc-note { font-size: 12px; color: #475569; background: #f8fafc; border-left: 3px solid #cbd5e1;
    padding: 8px 10px; margin: 0 0 16px; }
  .qrc-note.importante { border-left-color: #b45309; background: #fffbeb; }
  .qrc-ok { border-left-color: #16a34a; background: #f0fdf4; }
  .qrc-champs { display: grid; gap: 12px; max-width: 620px; margin: 0 0 18px; padding: 0; border: 0; }
  .qrc-champs label { font-size: 12px; color: #334155; display: grid; gap: 4px; }
  .qrc-champs input[type=text], .qrc-champs textarea, .qrc-champs select { font-size: 13px; padding: 7px 9px;
    border: 1px solid #cbd5e1; border-radius: 7px; font-family: inherit; }
  .qrc-champs textarea { min-height: 78px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .qrc-champs .case { display: flex; gap: 7px; align-items: center; font-size: 13px; }
  .qrc-erreurs { border: 1px solid #fecaca; background: #fef2f2; border-radius: 8px; padding: 10px 12px; margin: 0 0 16px;
    font-size: 13px; color: #991b1b; }
  .qrc-erreurs ul { margin: 4px 0 0; padding-left: 18px; }
  table.qrc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.qrc-table th, table.qrc-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
  table.qrc-table thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; }
  table.qrc-table td.n, table.qrc-table th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .qrc-nav { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; margin: 0 0 18px; }
  .qrc-nav a.lien-actif { font-weight: 600; color: #1d4ed8; }
  .qrc-qr { width: 190px; height: 190px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; padding: 6px; }
  .qrc-lien { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
  .qrc-badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #3730a3; }
  .qrc-badge.admin { background: #fef3c7; color: #92400e; }
  .qrc-badge.dyn { background: #dbeafe; color: #1e40af; }
  .qrc-badge.stat { background: #dcfce7; color: #166534; }
</style>
